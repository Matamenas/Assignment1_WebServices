$kind: http-request
name: GET /getAll - Verify Product Appears in List
method: GET
url: "{{baseUrl}}/getAll"
order: 4000
scripts:
  - type: afterResponse
    code: >
      // ── Status code
      ──────────────────────────────────────────────────────────

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
