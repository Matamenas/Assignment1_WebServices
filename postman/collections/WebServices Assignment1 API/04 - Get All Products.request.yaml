$kind: http-request
name: GET /getAll - Verify Product Appears in List
method: GET
url: "{{baseUrl}}/getAll"
order: 4000
scripts:
  - type: afterResponse
    code: >-
      // ── Status code
      ──────────────────────────────────────────────────────────

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });


      // ── Response time
      ─────────────────────────────────────────────────────────

      pm.test("Response time is under 5000 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(5000);
      });


      // ── Content-Type
      ──────────────────────────────────────────────────────────

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });


      // ── Response is an array
      ──────────────────────────────────────────────────

      pm.test("Response is an array", function () {
          const json = pm.response.json();
          pm.expect(json).to.be.an("array");
      });


      // ── Array is non-empty
      ────────────────────────────────────────────────────

      pm.test("Product list is not empty", function () {
          const json = pm.response.json();
          pm.expect(json.length).to.be.above(0);
      });


      // ── Each item has required fields
      ─────────────────────────────────────────

      pm.test("Every product in the list has required fields", function () {
          const json = pm.response.json();
          json.forEach(function (product) {
              pm.expect(product).to.have.all.keys("ProductID", "Name", "UnitPrice", "StockQuantity", "Description");
          });
      });


      // ── Test product is present in the list
      ───────────────────────────────────

      pm.test("Created test product appears in /getAll response", function () {
          const json = pm.response.json();
          const targetId = pm.collectionVariables.get("productId");
          const found = json.some(function (p) { return p.ProductID === targetId; });
          pm.expect(found, "Product with ID " + targetId + " not found in /getAll").to.be.true;
      });


      // ── UnitPrice type check on all items
      ─────────────────────────────────────

      pm.test("All UnitPrice values are numbers", function () {
          const json = pm.response.json();
          json.forEach(function (product) {
              pm.expect(product.UnitPrice).to.be.a("number");
          });
      });
    language: text/javascript
