$kind: http-request
name: 'POST /addnew - Create Test Product'
method: POST
url: '{{baseUrl}}/addnew'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "ProductID": "{{productId}}",
      "Name": "{{testProductName}}",
      "UnitPrice": {{testProductUnitPrice}},
      "StockQuantity": {{testProductStockQuantity}},
      "Description": "{{testProductDescription}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Status code ──────────────────────────────────────────────────────────
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      // ── Response time ─────────────────────────────────────────────────────────
      pm.test("Response time is under 3000 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });

      // ── Content-Type ──────────────────────────────────────────────────────────
      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      // ── Body schema ───────────────────────────────────────────────────────────
      pm.test("Response body has 'message' field", function () {
          const json = pm.response.json();
          pm.expect(json).to.be.an("object");
          pm.expect(json).to.have.property("message");
      });

      pm.test("Product added successfully message returned", function () {
          const json = pm.response.json();
          pm.expect(json.message).to.eql("Product added successfully");
      });

      // ── Confirm collection variable was set ───────────────────────────────────
      pm.test("productId collection variable is set", function () {
          const pid = pm.collectionVariables.get("productId");
          pm.expect(pid).to.be.a("string").and.to.have.length.above(0);
      });
