$kind: http-request
name: POST /addnew - Create Test Product
method: POST
url: '{{baseUrl}}/addnew?ProductID=3000&Name=Nvidia
  5090&UnitPrice=1399.99&StockQuantity=1&Description="OverPriced Video Card
  Designed For Best Gaming Experience"'
queryParams:
  ProductID: "3000"
  Name: Nvidia 5090
  UnitPrice: "1399.99"
  StockQuantity: "1"
  Description: '"OverPriced Video Card Designed For Best Gaming Experience"'
order: 2000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "ProductID": "{{productId}}",
      "Name": "{{testProductName}}",
      "UnitPrice": {{testProductUnitPrice}},
      "StockQuantity": {{testProductStockQuantity}},
      "Description": "{{testProductDescription}}"
    }
scripts:
  - type: afterResponse
    code: >
      // ── Status code
      ──────────────────────────────────────────────────────────

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
