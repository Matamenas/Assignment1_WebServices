$kind: http-request
name: 'GET /startsWith/{letter} - Verify Product Appears by First Letter'
method: GET
url: '{{baseUrl}}/startsWith/{{productFirstLetter}}'
order: 5000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // ── Status code ──────────────────────────────────────────────────────────
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      // ── Response time ─────────────────────────────────────────────────────────
      pm.test("Response time is under 3000 ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(3000);
      });

      // ── Content-Type ──────────────────────────────────────────────────────────
      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      // ── Response is an array ──────────────────────────────────────────────────
      pm.test("Response is an array", function () {
          const json = pm.response.json();
          pm.expect(json).to.be.an("array");
      });

      // ── All returned products start with the correct letter ───────────────────
      pm.test("All returned products start with the queried letter", function () {
          const json = pm.response.json();
          const letter = pm.collectionVariables.get("productFirstLetter");
          json.forEach(function (product) {
              pm.expect(product.Name.charAt(0).toUpperCase()).to.eql(letter.toUpperCase());
          });
      });

      // ── Test product is present in the filtered list ──────────────────────────
      pm.test("Created test product appears in /startsWith response", function () {
          const json = pm.response.json();
          const targetId = pm.collectionVariables.get("productId");
          const found = json.some(function (p) { return p.ProductID === targetId; });
          pm.expect(found, "Product with ID " + targetId + " not found in /startsWith response").to.be.true;
      });

      // ── Schema check on returned items ────────────────────────────────────────
      pm.test("Every product in startsWith response has required fields", function () {
          const json = pm.response.json();
          json.forEach(function (product) {
              pm.expect(product).to.have.all.keys("ProductID", "Name", "UnitPrice", "StockQuantity", "Description");
          });
      });
