$kind: http-request
name: GET /convert/{id} - Verify Currency Conversion
method: GET
url: "{{baseUrl}}/convert/1020"
order: 7000
scripts:
  - type: afterResponse
    code: >-
      // ── Status code
      ──────────────────────────────────────────────────────────

      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });



      // ── Product found
      ─────────────────────────────────────────────────────────

      pm.test("Response is a product object, not a 'not found' message",
      function () {
          const json = pm.response.json();
          pm.expect(json).to.be.an("object");
          pm.expect(json).to.not.have.property("message");
      });


      // ── Schema: required fields present
      ──────────────────────────────────────

      pm.test("Response contains all required product fields", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.all.keys("ProductID", "Name", "UnitPrice", "StockQuantity", "Description");
      });


      // ── UnitPrice is numeric
      ──────────────────────────────────────────────────

      pm.test("Converted UnitPrice is a number", function () {
          const json = pm.response.json();
          pm.expect(json.UnitPrice).to.be.a("number");
      });


      // ── UnitPrice is positive
      ─────────────────────────────────────────────────

      pm.test("Converted UnitPrice is greater than zero", function () {
          const json = pm.response.json();
          pm.expect(json.UnitPrice).to.be.above(0);
      });


      // ── Converted price differs from original (or equals it when rate ≈ 1)
      ───

      pm.test("Converted UnitPrice exists and is a valid number (may equal
      original if EUR rate ≈ 1)", function () {
          const json = pm.response.json();
          const original = parseFloat(pm.collectionVariables.get("originalUnitPrice") || "9.99");
          // The converted value must be a finite number.
          pm.expect(isFinite(json.UnitPrice)).to.be.true;
          // Log for visibility; we allow equality only when the exchange rate is 1.
          console.log("Original USD price:", original, "| Converted EUR price:", json.UnitPrice);
      });


      pm.test("Converted UnitPrice is different from original USD price (or rate
      is 1)", function () {
          const json = pm.response.json();
          const original = parseFloat(pm.collectionVariables.get("originalUnitPrice") || "9.99");
          // Accept equality only if the rate happens to be exactly 1.
          // In practice EUR/USD rate is never exactly 1, so this will catch regressions.
          const rateIsOne = Math.abs(json.UnitPrice - original) < 0.001;
          if (!rateIsOne) {
              pm.expect(json.UnitPrice).to.not.eql(original);
          } else {
              // Rate was 1 — still assert the field exists and is numeric.
              pm.expect(json.UnitPrice).to.be.a("number");
          }
      });


      // ── ProductID unchanged
      ───────────────────────────────────────────────────

      pm.test("ProductID in convert response matches the requested product",
      function () {
          const json = pm.response.json();
          const expected = pm.collectionVariables.get("productId");
          pm.expect(json.ProductID).to.eql(expected);
      });
    language: text/javascript
